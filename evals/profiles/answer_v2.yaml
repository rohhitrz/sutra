# The A/B arm for `answer.v2` (Phase 5, step 3). Identical to `advanced.yaml` in every
# retrieval setting — one changed line, `prompt_version_answer` — so the difference between the
# two reports is the prompt and nothing else.
#
# The hypothesis is in `prompts/answer.v2.md`: v1 over-refuses. From
# `2026-10-21_advanced.run2`, multi-hop scored correctness 0.50 against faithfulness 1.00 and
# 3 of 36 answerable rows were falsely refused — and a refusal asserts nothing, so it cannot be
# unfaithful. v2 rebalances the refusal threshold toward synthesis.
#
# Read `by_category` before the headline, in this order:
#   1. unanswerable.refusal_correct — was 0.833. This is where the risk lands: if v2 trades
#      false refusals for false answers, it falls here, and that is a worse failure than the
#      one being fixed.
#   2. multi-hop.correctness and temporal.correctness — was 0.500 and 0.714. The predicted gain.
#   3. refusal.falsely_refused — was 3 of 36. The mechanism, stated directly.
#
# Judge noise is at least ±0.05 (known issue 3) and retrieval metrics are stochastic for this
# family because HyDE is a model call, so a small delta here means nothing without repeats.
# Retrieval numbers should move only by that noise: nothing before the generator changed.
name: answer_v2
description: The advanced retrieval configuration with answer.v2, whose only change from v1 is a refusal threshold rebalanced toward synthesis.

# Retrieval
top_k: 5
index_version: 3
expand_to_parent: true
retrieval_mode: hybrid
candidate_k: 20
rrf_k: 60
rerank_enabled: true
rerank_candidates: 20
query_rewrite_enabled: false
hyde_enabled: true
router_enabled: false

# Generation
prompt_version_answer: v2

judges: [faithfulness, relevance, correctness]
concurrency: 4
